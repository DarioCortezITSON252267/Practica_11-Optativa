<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Deportiva ITSON · Componentes y React</title>
  <link rel="stylesheet" href="/src/estilos.css">
</head>
<body>

  <header class="encabezado">
    <div class="encabezado__marca">
      <img src="/img/logo.svg" alt="" height="34">
      <span>ITSON</span>
    </div>

    <div class="encabezado__carrito">
      <span>Carrito: <strong id="cuenta">0</strong></span>
      <!-- Paso 1: variante puede ser primario, secundario o peligro -->
      <boton-app id="vaciar" variante="secundario">Vaciar</boton-app>
    </div>
  </header>

  <main class="contenido">
    <!-- Práctica 12: el contenedor vacío. Lo llena React desde src/main.tsx -->
    <div id="root"></div>

    <section class="portada">
      <h1>Catálogo de temporada</h1>
      <p>Doce productos. Una sola tarjeta escrita una vez.</p>
    </section>

    <!-- Práctica 11: src/catalogo.ts crea aquí una <tarjeta-producto> por cada producto -->
    <section class="rejilla" id="rejilla"></section>

    <!-- Tarea: aquí pueden montar sus dos componentes nuevos. -->
    <section class="tarea" id="tarea"></section>
  </main>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
